name: Update Employment News data
on:
  schedule:
    - cron: "30 1 * * *"      # every day, about 7:00 AM India time
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "job-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add en.json
          git diff --cached --quiet || (git commit -m "Update Employment News data" && git push)
